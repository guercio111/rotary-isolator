name: Layout Designer APK
on:
  push:
    paths:
      - 'LayoutDesigner/**'
      - '.github/workflows/layout-designer.yml'
    branches:
      - 'feature/frequalizer-layout-designer'
      - 'feature/layout-designer-build918-fidelity'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build standalone APK
        run: gradle -p LayoutDesigner :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FREQUALIZER-Layout-Designer-debug
          path: LayoutDesigner/app/build/outputs/apk/debug/app-debug.apk
