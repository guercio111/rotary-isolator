name: Build Rotary Isolator APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip RotaryIsolator-build-package.zip -d extracted

      - name: Configure Android 14+ media projection foreground service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("extracted/RotaryIsolator")
          manifests = list(root.glob("**/src/main/AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          manifest = manifests[0]
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ns = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(manifest)
          mroot = tree.getroot()

          for permission in (
              "android.permission.RECORD_AUDIO",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION",
          ):
              if not any(e.tag == "uses-permission" and e.get(ns+"name") == permission for e in mroot):
                  ET.SubElement(mroot, "uses-permission", {ns+"name": permission})

          app = mroot.find("application")
          if app is None:
              raise SystemExit("application element not found")
          service_name = "com.example.rotaryisolator.AudioCaptureFgService"
          service = next((e for e in app.findall("service") if e.get(ns+"name") == service_name), None)
          if service is None:
              service = ET.SubElement(app, "service")
              service.set(ns+"name", service_name)
          service.set(ns+"exported", "false")
          service.set(ns+"foregroundServiceType", "mediaProjection")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          java = root / "app/src/main/java/com/example/rotaryisolator/AudioCaptureFgService.kt"
          java.parent.mkdir(parents=True, exist_ok=True)
          java.write_text("""package com.example.rotaryisolator

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          class AudioCaptureFgService : Service() {
              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= 26) {
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(
                          NotificationChannel(CHANNEL_ID, "Isolator audio capture", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  return try {
                      val notification = if (Build.VERSION.SDK_INT >= 26) {
                          Notification.Builder(this, CHANNEL_ID)
                      } else {
                          @Suppress("DEPRECATION")
                          Notification.Builder(this)
                      }.setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle("Rotary Isolator")
                          .setContentText("Audio FX capture is active")
                          .setOngoing(true)
                          .build()
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                      } else {
                          startForeground(NOTIFICATION_ID, notification)
                      }
                      sendBroadcast(Intent(ACTION_READY).setPackage(packageName))
                      START_NOT_STICKY
                  } catch (t: Throwable) {
                      sendBroadcast(Intent(ACTION_FAILED).setPackage(packageName))
                      stopSelf(startId)
                      START_NOT_STICKY
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              companion object {
                  const val ACTION_READY = "com.example.rotaryisolator.CAPTURE_FGS_READY"
                  const val ACTION_FAILED = "com.example.rotaryisolator.CAPTURE_FGS_FAILED"
                  private const val CHANNEL_ID = "isolator_audio_capture"
                  private const val NOTIFICATION_ID = 7303
              }
          }
          """)
          print("Configured foreground mediaProjection service:", java)
          PY

      - name: Use maintained Kotlin source
        run: |
          cp RotaryIsolator/app/src/main/java/com/example/rotaryisolator/MainActivity.kt extracted/RotaryIsolator/app/src/main/java/com/example/rotaryisolator/MainActivity.kt

      - name: Set Java compatibility to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/RotaryIsolator/app/build.gradle")
          if not p.exists():
              p = Path("extracted/RotaryIsolator/app/build.gradle.kts")
          s = p.read_text()
          if p.name.endswith(".kts"):
              block = "    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n"
          else:
              block = "    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n"
          s = s.replace("android {", "android {\n" + block, 1)
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd extracted/RotaryIsolator
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rotary-isolator-debug-apk
          path: extracted/RotaryIsolator/app/build/outputs/apk/debug/app-debug.apk
