name: Build Rotary Isolator APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip RotaryIsolator-build-package.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/RotaryIsolator
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rotary-isolator-debug-apk
          path: extracted/RotaryIsolator/app/build/outputs/apk/debug/app-debug.apk
