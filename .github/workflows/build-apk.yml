# Tablet reverb refinement test 248
name: Build FREQUALIZER TEST 248 APK
# Persistent capture on resize; smoother mid/high reverb and round power

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip RotaryIsolator-build-package.zip -d extracted

      - name: Rename app to FREQUALIZER
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifests = list(Path("extracted").rglob("AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          for p in manifests:
              s = p.read_text()
              s, n = re.subn(r'android:label="[^"]+"', 'android:label="FREQUALIZER TEST 248"', s, count=1)
              if n:
                  p.write_text(s)
                  print(f"Updated app label in {p}")
                  break
          else:
              raise SystemExit("android:label not found in manifest")
          PY

      - name: Generate EQ launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          /usr/bin/python3 .github/scripts/generate_app_icon.py extracted/RotaryIsolator

      - name: Use maintained Kotlin source and isolated reverb test service
        run: |
          mkdir -p extracted/RotaryIsolator/app/src/main/aidl/com/example/rotaryisolator
          cp RotaryIsolator/app/src/main/java/com/example/rotaryisolator/MainActivity.kt extracted/RotaryIsolator/app/src/main/java/com/example/rotaryisolator/MainActivity.kt
          cp RotaryIsolator/app/src/main/java/com/example/rotaryisolator/ShizukuReverbUserService.kt extracted/RotaryIsolator/app/src/main/java/com/example/rotaryisolator/ShizukuReverbUserService.kt
          cp RotaryIsolator/app/src/main/java/com/example/rotaryisolator/AudioCaptureForegroundService.kt extracted/RotaryIsolator/app/src/main/java/com/example/rotaryisolator/AudioCaptureForegroundService.kt
          cp RotaryIsolator/app/src/main/java/com/example/rotaryisolator/SchroederReverb.kt extracted/RotaryIsolator/app/src/main/java/com/example/rotaryisolator/SchroederReverb.kt
          cp RotaryIsolator/app/src/main/aidl/com/example/rotaryisolator/IShizukuReverbService.aidl extracted/RotaryIsolator/app/src/main/aidl/com/example/rotaryisolator/IShizukuReverbService.aidl

      - name: Enable Shizuku API and provider
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("extracted/RotaryIsolator/app")
          gradle = app / "build.gradle"
          if not gradle.exists():
              gradle = app / "build.gradle.kts"
          source = gradle.read_text()
          if "dev.rikka.shizuku:api" not in source:
              if gradle.name.endswith(".kts"):
                  dep = 'dependencies {\n    implementation("dev.rikka.shizuku:api:13.1.5")\n    implementation("dev.rikka.shizuku:provider:13.1.5")\n}\n'
                  if "dependencies {" in source:
                      source = source.replace("dependencies {", 'dependencies {\n    implementation("dev.rikka.shizuku:api:13.1.5")\n    implementation("dev.rikka.shizuku:provider:13.1.5")', 1)
                  else:
                      source += "\n" + dep
              else:
                  dep = "dependencies {\n    implementation 'dev.rikka.shizuku:api:13.1.5'\n    implementation 'dev.rikka.shizuku:provider:13.1.5'\n}\n"
                  if "dependencies {" in source:
                      source = source.replace("dependencies {", "dependencies {\n    implementation 'dev.rikka.shizuku:api:13.1.5'\n    implementation 'dev.rikka.shizuku:provider:13.1.5'", 1)
                  else:
                      source += "\n" + dep
          if "aidl true" not in source and "aidl = true" not in source:
              if "buildFeatures {" in source:
                  line = "aidl = true" if gradle.name.endswith(".kts") else "aidl true"
                  source = source.replace("buildFeatures {", "buildFeatures {\n        " + line, 1)
              else:
                  line = "aidl = true" if gradle.name.endswith(".kts") else "aidl true"
                  source = source.replace("android {", "android {\n    buildFeatures { " + line + " }\n", 1)
          gradle.write_text(source)
          manifests = list(app.glob("src/main/AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("app AndroidManifest.xml not found")
          manifest = manifests[0]
          xml = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
          ]
          for permission in permissions:
              name = permission.split('"')[1]
              if name not in xml:
                  xml = xml.replace("<application", permission + "\n    <application", 1)
          capture_service = '''        <service
              android:name=".AudioCaptureForegroundService"
              android:exported="false"
              android:foregroundServiceType="mediaProjection" />
          '''
          if "AudioCaptureForegroundService" not in xml:
              xml = xml.replace("</application>", capture_service + "\n    </application>", 1)
          provider = '''        <provider
              android:name="rikka.shizuku.ShizukuProvider"
              android:authorities="${applicationId}.shizuku"
              android:enabled="true"
              android:exported="true"
              android:multiprocess="false"
              android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
          '''
          if "rikka.shizuku.ShizukuProvider" not in xml:
              if "</application>" not in xml:
                  raise SystemExit("application closing tag not found")
              xml = xml.replace("</application>", provider + "\n    </application>", 1)
              manifest.write_text(xml)
          PY

      - name: Preserve MediaProjection during window resize
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("extracted/RotaryIsolator/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          required = "orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|density"
          tags = list(re.finditer(r'<activity\\b[^>]*>', xml))
          match = next((m for m in tags if "MainActivity" in m.group(0)), None)
          if match is None:
              raise SystemExit("MainActivity declaration not found in manifest")
          tag = match.group(0)
          if "android:configChanges=" in tag:
              tag = re.sub(r'android:configChanges="([^"]*)"', lambda m: 'android:configChanges="' + "|".join(dict.fromkeys((m.group(1) + "|" + required).split("|"))) + '"', tag, count=1)
          else:
              tag = tag[:-1] + ' android:configChanges="' + required + '">'
          xml = xml[:match.start()] + tag + xml[match.end():]
          xml = re.sub(r'(<service\\b(?=[^>]*AudioCaptureForegroundService)[^>]*)(/?>)', lambda m: m.group(1) + (' android:stopWithTask="false"' if 'android:stopWithTask=' not in m.group(1) else '') + m.group(2), xml, count=1)
          manifest.write_text(xml)
          PY

      - name: Set Java compatibility to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/RotaryIsolator/app/build.gradle")
          if not p.exists():
              p = Path("extracted/RotaryIsolator/app/build.gradle.kts")
          s = p.read_text()
          if p.name.endswith(".kts"):
              block = "    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n"
              app_id_suffix = 'defaultConfig {\n        applicationIdSuffix = ".test248"'
          else:
              block = "    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n"
              app_id_suffix = 'defaultConfig {\n        applicationIdSuffix ".test248"'
          if "defaultConfig {" not in s:
              raise SystemExit("defaultConfig block not found")
          s = s.replace("defaultConfig {", app_id_suffix, 1)
          s = s.replace("android {", "android {\n" + block, 1)
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd extracted/RotaryIsolator
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: frequalizer-test248
          path: extracted/RotaryIsolator/app/build/outputs/apk/debug/app-debug.apk
