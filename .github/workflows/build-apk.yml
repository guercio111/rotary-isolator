name: Build FREQUALIZER S25 Stable Reverb TEST252 APK
# Dedicated phone test build from Stable 165. Mixer source and audio behavior remain unchanged.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip RotaryIsolator-build-package.zip -d extracted

      - name: Rename app to FREQUALIZER S25 STABLE REVERB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifests = list(Path("extracted").rglob("AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          for p in manifests:
              s = p.read_text()
              s, n = re.subn(r'android:label="[^"]+"', 'android:label="FREQUALIZER S25 STABLE REVERB"', s, count=1)
              if n:
                  p.write_text(s)
                  print(f"Updated app label in {p}")
                  break
          else:
              raise SystemExit("android:label not found in manifest")
          PY

      - name: Generate EQ launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          /usr/bin/python3 .github/scripts/generate_app_icon.py extracted/RotaryIsolator

      - name: Use exact S25 layout source plus TEST252 reverb engine
        run: |
          cp RotaryIsolator/app/src/main/java/com/example/rotaryisolator/MainActivity.kt extracted/RotaryIsolator/app/src/main/java/com/example/rotaryisolator/MainActivity.kt
          cp RotaryIsolator/app/src/main/java/com/example/rotaryisolator/SchroederReverb.kt extracted/RotaryIsolator/app/src/main/java/com/example/rotaryisolator/SchroederReverb.kt
          cp RotaryIsolator/app/src/main/java/com/example/rotaryisolator/AudioCaptureForegroundService.kt extracted/RotaryIsolator/app/src/main/java/com/example/rotaryisolator/AudioCaptureForegroundService.kt

      - name: Configure Android internal audio capture and keep projection through rotation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path("extracted/RotaryIsolator/app")
          manifest = app / "src/main/AndroidManifest.xml"
          xml = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
          ]
          for permission in permissions:
              name = permission.split('"')[1]
              if name not in xml:
                  xml = xml.replace("<application", permission + "\n    <application", 1)
          service = '''        <service
              android:name=".AudioCaptureForegroundService"
              android:exported="false"
              android:foregroundServiceType="mediaProjection" />
          '''
          if "AudioCaptureForegroundService" not in xml:
              xml = xml.replace("</application>", service + "\n    </application>", 1)
          required = "orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|density"
          tags = list(re.finditer(r'<activity\b[^>]*>', xml))
          match = next((m for m in tags if "MainActivity" in m.group(0)), None)
          if match is None:
              raise SystemExit("MainActivity declaration not found in manifest")
          tag = match.group(0)
          if "android:configChanges=" in tag:
              tag = re.sub(r'android:configChanges="([^"]*)"', lambda m: 'android:configChanges="' + "|".join(dict.fromkeys((m.group(1) + "|" + required).split("|"))) + '"', tag, count=1)
          else:
              closing = "/>" if tag.rstrip().endswith("/>") else ">"
              body = tag.rstrip()[:-2].rstrip() if closing == "/>" else tag.rstrip()[:-1].rstrip()
              tag = body + ' android:configChanges="' + required + '"' + closing
          xml = xml[:match.start()] + tag + xml[match.end():]
          import xml.etree.ElementTree as ET
          ET.fromstring(xml)
          manifest.write_text(xml)
          PY

      - name: Set Java compatibility to 17 and isolate test installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/RotaryIsolator/app/build.gradle")
          if not p.exists():
              p = Path("extracted/RotaryIsolator/app/build.gradle.kts")
          s = p.read_text()
          if p.name.endswith(".kts"):
              block = "    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n"
              app_id_suffix = 'defaultConfig {\n        applicationIdSuffix = ".test"'
          else:
              block = "    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n"
              app_id_suffix = 'defaultConfig {\n        applicationIdSuffix ".test"'
          if "defaultConfig {" not in s:
              raise SystemExit("defaultConfig block not found")
          s = s.replace("defaultConfig {", app_id_suffix, 1)
          s = s.replace("android {", "android {\n" + block, 1)
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd extracted/RotaryIsolator
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: frequalizer-s25-stable-reverb-test252-apk
          path: extracted/RotaryIsolator/app/build/outputs/apk/debug/app-debug.apk
